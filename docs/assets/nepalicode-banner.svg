<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">NepaliCode animated banner</title>
  <desc id="desc">A dark developer-themed NepaliCode banner with animated crimson and cyan code accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="0.55" stop-color="#17283b"/>
      <stop offset="1" stop-color="#27182c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0" stop-color="#ff315f"/>
      <stop offset="1" stop-color="#ff8a5c"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: center; }
      .slide { animation: slide 7s linear infinite; }
      .blink { animation: blink 1.4s steps(2, jump-none) infinite; }
      @keyframes pulse { 0%,100% { opacity:.55; transform:scale(.92) } 50% { opacity:1; transform:scale(1.08) } }
      @keyframes slide { from { transform:translateX(-120px) } to { transform:translateX(1420px) } }
      @keyframes blink { 0%,45% { opacity:1 } 46%,100% { opacity:.18 } }
    </style>
  </defs>
  <rect width="1400" height="360" rx="34" fill="url(#bg)"/>
  <circle class="pulse" cx="250" cy="170" r="120" fill="#ff315f" opacity=".28" filter="url(#blur)"/>
  <circle class="pulse" cx="1120" cy="205" r="130" fill="#00d4e8" opacity=".18" filter="url(#blur)"/>
  <path d="M0 286 C250 220 400 340 660 270 S1080 180 1400 260" fill="none" stroke="#263b53" stroke-width="2"/>
  <path class="slide" d="M-80 70 H80" stroke="#00d4e8" stroke-width="3" opacity=".7"/>
  <path class="slide" d="M-300 300 H-80" stroke="#ff315f" stroke-width="3" opacity=".65"/>
  <g transform="translate(120 82)">
    <path d="M72 0 L142 38 L72 76 L2 38 Z" fill="none" stroke="url(#glow)" stroke-width="9"/>
    <path d="M42 72 L72 90 L102 72 M42 18 L72 36 L102 18" fill="none" stroke="#ffd9df" stroke-width="6" stroke-linecap="round"/>
    <path d="M0 82 C18 82 25 70 25 52 V28 C25 10 36 0 54 0 M144 0 C126 0 119 10 119 28 V52 C119 70 108 82 90 82" fill="none" stroke="#ff315f" stroke-width="8" stroke-linecap="round"/>
    <circle class="blink" cx="72" cy="38" r="6" fill="#00d4e8"/>
  </g>
  <text x="330" y="150" fill="#f7f8fb" font-family="Inter,Segoe UI,sans-serif" font-size="64" font-weight="800" letter-spacing="2">NepaliCode</text>
  <text x="334" y="205" fill="#a9bacd" font-family="Inter,Segoe UI,sans-serif" font-size="24" letter-spacing="5">NEPALI-FIRST DEVELOPER TOOLS</text>
  <text x="334" y="265" fill="#00d4e8" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20">&gt; बनाउनुहोस् । सिक्नुहोस् । साझा गर्नुहोस् ।</text>
  <rect x="334" y="292" width="390" height="3" rx="2" fill="url(#glow)"/>
  <rect class="blink" x="735" y="283" width="14" height="22" rx="2" fill="#00d4e8"/>
</svg>
